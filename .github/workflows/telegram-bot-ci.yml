name: K2App Telegram Bot CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'telegram-bot/**'
      - '.github/workflows/telegram-bot-ci.yml'
  pull_request:
    paths:
      - 'telegram-bot/**'
      - '.github/workflows/telegram-bot-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
        working-directory: telegram-bot

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
        working-directory: telegram-bot

      - name: Compile Python source
        run: python -m py_compile bot.py
        working-directory: telegram-bot

      - name: Build Docker image
        run: docker build -t k2app-telegram-bot .
        working-directory: telegram-bot
