name: K2App Lite APK

on:
  push:
    paths:
      - 'lite/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle/**'
      - '.github/workflows/k2app-lite-apk.yml'
  pull_request:
    paths:
      - 'lite/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle/**'
      - '.github/workflows/k2app-lite-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-lite-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build K2App Lite debug APK
        run: |
          chmod +x gradlew
          ./gradlew :lite:assembleDebug --stacktrace --warning-mode none
      - name: Upload K2App Lite APK
        uses: actions/upload-artifact@v4
        with:
          name: K2App-Lite-debug
          path: lite/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
