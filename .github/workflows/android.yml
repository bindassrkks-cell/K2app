name: Android CI Auto-Build

env:
  main_project_module: app

permissions:
  contents: write

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: false
        default: 'assembleRelease'
        type: choice
        options:
          - assembleRelease
          - assembleDebug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Setup Keystores & Properties
        run: |
          mkdir -p ~/.android app
          rm -f debug.keystore release_keystore.jks app/debug.keystore app/release_keystore.jks
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore app/debug.keystore
          cp debug.keystore app/release_keystore.jks
          cp debug.keystore release_keystore.jks
          touch local.properties
          printf "storeFile=release_keystore.jks\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n" > keystore.properties
          cp keystore.properties app/keystore.properties

      - name: Auto-Clean Duplicate Imports in MoreFragment.kt
        run: |
          python3 - << 'PYEOF'
          import os
          import re

          more_kt = 'app/src/main/java/com/deniscerri/ytdl/ui/more/MoreFragment.kt'
          if os.path.exists(more_kt):
              with open(more_kt, 'r', encoding='utf-8') as f:
                  lines = f.readlines()

              # Duplicate / conflicting imports remove karna
              cleaned_lines = []
              for line in lines:
                  trimmed = line.strip()
                  if trimmed.startswith('import android.widget.TextView') or trimmed.startswith('import com.deniscerri.ytdl.ui.quran.QuranActivity'):
                      continue
                  cleaned_lines.append(line)

              code = "".join(cleaned_lines)

              # Single clean import package ke theek neeche add karna
              code = re.sub(
                  r'(package [^\n]+)',
                  r'\1\nimport android.widget.TextView\nimport com.deniscerri.ytdl.ui.quran.QuranActivity',
                  code,
                  count=1
              )

              # Quran click listener attach karna agar exist nahi karta
              if 'R.id.quran_app' not in code:
                  hook = '''
                  view.findViewById<TextView>(R.id.quran_app)?.setOnClickListener {
                      startActivity(android.content.Intent(requireContext(), QuranActivity::class.java))
                  }
                  '''
                  if 'settings =' in code:
                      code = code.replace('settings =', hook + '\n        settings =')

              with open(more_kt, 'w', encoding='utf-8') as f:
                  f.write(code)

          print("SUCCESS: MoreFragment imports sanitized!")
          PYEOF

      - name: Verify Missing IDs, Theme & Drawables
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > app/src/main/res/values/missing_ids.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <item name="settingsFragment" type="id" />
              <item name="downloadsFragment" type="id" />
              <item name="pill_downloads" type="id" />
              <item name="pill_quran" type="id" />
              <item name="pill_history" type="id" />
              <item name="pill_input_url" type="id" />
              <item name="quran_app" type="id" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/theme_compat.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.YTDLnis" parent="Theme.Material3.DayNight.NoActionBar" />
          </resources>
          EOF

          if [ ! -f "app/src/main/res/drawable/ic_download.xml" ]; then
            cat << 'EOF' > app/src/main/res/drawable/ic_download.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M19,9h-4V3H9v6H5l7,7 7,-7zM5,18v2h14v-2H5z"/>
          </vector>
          EOF
          fi

          if [ ! -f "app/src/main/res/drawable/ic_more_vert.xml" ]; then
            cat << 'EOF' > app/src/main/res/drawable/ic_more_vert.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,8c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zm0,2c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2zm0,6c-1.1,0 -2,0.9 -2,2s0.9,2 2,2 2,-0.9 2,-2 -0.9,-2 -2,-2z"/>
          </vector>
          EOF
          fi

      - name: Build Android APK
        run: |
          chmod +x gradlew
          BUILD_TASK="${{ inputs.build_type || 'assembleRelease' }}"
          ./gradlew ":${{ env.main_project_module }}:${BUILD_TASK}" \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseParallelGC" \
            --stacktrace --warning-mode none

      - name: Collect Output APKs
        if: success()
        run: |
          mkdir -p build_output_apks
          find . -type f -name "*.apk" -not -path "*/intermediates/*" -exec cp {} build_output_apks/ \;
          echo "Collected APK files:"
          ls -lh build_output_apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: App-Release-Builds
          path: build_output_apks/
          if-no-files-found: error
