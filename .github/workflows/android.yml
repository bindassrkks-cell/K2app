name: Android CI Auto-Build

env:
  main_project_module: app

permissions:
  contents: write

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'corretto'
        cache: 'gradle'

    - name: Auto-Resolve Missing Keystores & Properties
      run: |
        # 1. Create debug.keystore for both root and app directory
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        mkdir -p app
        cp debug.keystore app/debug.keystore

        # 2. Setup release keystore (fallback to debug keystore if secret is missing/invalid)
        if [ -n "${{ secrets.BASE_64_SIGNING_KEY }}" ]; then
          echo "${{ secrets.BASE_64_SIGNING_KEY }}" | base64 -d > app/release_keystore.jks 2>/dev/null || cp debug.keystore app/release_keystore.jks
        else
          cp debug.keystore app/release_keystore.jks
        fi
        cp app/release_keystore.jks release_keystore.jks

        # 3. Handle local.properties and keystore.properties
        touch local.properties
        if [ -n "${{ secrets.LOCAL_PROPERTIES }}" ]; then
          echo "${{ secrets.LOCAL_PROPERTIES }}" > keystore.properties
        else
          cat << 'EOF' > keystore.properties
storeFile=release_keystore.jks
storePassword=android
keyAlias=androiddebugkey
keyPassword=android
EOF
        fi
        cp keystore.properties app/keystore.properties

    # Missing drawables aur naye UI ko auto-inject karega
    - name: Run UI Fix Script
      run: |
        if [ -f fix_ui.py ]; then
          python3 fix_ui.py
        else
          echo "fix_ui.py not found in root directory!"
        fi

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Android APK
      run: |
        ./gradlew :${{ env.main_project_module }}:assembleRelease --stacktrace || ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

    - name: Collect Output APKs
      run: |
        mkdir -p build_output_apks
        find . -type f -name "*.apk" -not -path "*/intermediates/*" -exec cp {} build_output_apks/ \;
        echo "Collected APK files:"
        ls -lh build_output_apks/

    - name: Upload APKs Artifact
      uses: actions/upload-artifact@v4
      with:
        name: App-Release-Builds
        path: build_output_apks/
        if-no-files-found: error

    - name: Send Telegram Notification
      if: always()
      continue-on-error: true
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          Status: ${{ job.status }}
          Actor: ${{ github.actor }}
          Commit: ${{ github.event.commits[0].message }}
          Repo: ${{ github.repository }}
