name: Android CI Auto-Build

env:
  main_project_module: app

permissions:
  contents: write

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - '*'
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: false
        default: 'assembleRelease'
        type: choice
        options:
          - assembleRelease
          - assembleDebug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Setup Keystores & Properties
        run: |
          mkdir -p ~/.android app
          rm -f debug.keystore release_keystore.jks app/debug.keystore app/release_keystore.jks
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore app/debug.keystore
          cp debug.keystore app/release_keystore.jks
          cp debug.keystore release_keystore.jks
          touch local.properties
          printf "storeFile=release_keystore.jks\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n" > keystore.properties
          cp keystore.properties app/keystore.properties

      - name: Apply Theme, Drawables & Quran Module
        run: |
          # 1. THEME COMPATIBILITY
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/theme_compat.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.YTDLnis" parent="Theme.Material3.DayNight.NoActionBar" />
          </resources>
          EOF

          # 2. DRAWABLES
          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/ic_quran.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M19,2L5,2c-1.1,0 -2,0.9 -2,2v16c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2L21,4c0,-1.1 -0.9,-2 -2,-2zM19,20L5,20L5,4h7v7l2.5,-1.5L17,11L17,4h2v16z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_play.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M8,5v14l11,-7z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_pause.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M6,19h4L10,5L6,5v14zM14,5v14h4L18,5h-4z"/>
          </vector>
          EOF

          # 3. QURAN ACTIVITY & LAYOUTS
          mkdir -p app/src/main/java/com/deniscerri/ytdl/ui/quran
          mkdir -p app/src/main/res/layout

          cat << 'EOF' > app/src/main/res/layout/activity_quran.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0A0B0E">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:gravity="center_vertical"
                  android:paddingHorizontal="16dp"
                  android:background="#16181F">

                  <ImageView
                      android:id="@+id/btn_back"
                      android:layout_width="36dp"
                      android:layout_height="36dp"
                      android:src="@drawable/ic_history"
                      app:tint="#FFFFFF"
                      android:padding="6dp" />

                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:layout_marginStart="12dp"
                      android:text="Al-Quran (القرآن الكريم)"
                      android:textColor="#00E676"
                      android:textSize="18sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <EditText
                  android:id="@+id/search_surah"
                  android:layout_width="match_parent"
                  android:layout_height="44dp"
                  android:layout_margin="12dp"
                  android:background="@drawable/ic_link"
                  android:backgroundTint="#16181F"
                  android:paddingHorizontal="16dp"
                  android:hint="Search Surah by name or number..."
                  android:textColor="#FFFFFF"
                  android:textColorHint="#757575"
                  android:textSize="14sp" />

              <ProgressBar
                  android:id="@+id/quran_progress"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:layout_marginTop="20dp"
                  android:visibility="gone" />

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/recycler_surahs"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:padding="8dp" />

              <LinearLayout
                  android:id="@+id/audio_player_bar"
                  android:layout_width="match_parent"
                  android:layout_height="65dp"
                  android:background="#16181F"
                  android:gravity="center_vertical"
                  android:paddingHorizontal="16dp"
                  android:visibility="gone">

                  <ImageView
                      android:id="@+id/btn_audio_play_pause"
                      android:layout_width="44dp"
                      android:layout_height="44dp"
                      android:src="@drawable/ic_pause"
                      app:tint="#00E676"
                      android:padding="8dp" />

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:layout_marginStart="12dp"
                      android:orientation="vertical">

                      <TextView
                          android:id="@+id/audio_surah_title"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Surah Playing"
                          android:textColor="#FFFFFF"
                          android:textSize="14sp"
                          android:textStyle="bold" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Reciter: Mishary Rashid Alafasy"
                          android:textColor="#00E676"
                          android:textSize="11sp" />
                  </LinearLayout>

                  <ImageView
                      android:id="@+id/btn_audio_close"
                      android:layout_width="32dp"
                      android:layout_height="32dp"
                      android:src="@drawable/ic_more_vert"
                      app:tint="#A0A0A0"
                      android:padding="6dp" />
              </LinearLayout>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_surah.xml
          <?xml version="1.0" encoding="utf-8"?>
          <com.google.android.material.card.MaterialCardView 
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:layout_marginHorizontal="6dp"
              android:layout_marginVertical="5dp"
              app:cardCornerRadius="14dp"
              app:cardBackgroundColor="#16181F"
              app:strokeColor="#262A36"
              app:strokeWidth="1dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center_vertical"
                  android:padding="12dp">

                  <TextView
                      android:id="@+id/surah_number"
                      android:layout_width="36dp"
                      android:layout_height="36dp"
                      android:gravity="center"
                      android:textColor="#00E676"
                      android:textSize="13sp"
                      android:textStyle="bold" />

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:layout_marginStart="14dp"
                      android:orientation="vertical">

                      <TextView
                          android:id="@+id/surah_english_name"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:textColor="#FFFFFF"
                          android:textSize="15sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/surah_meta"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:textColor="#808080"
                          android:textSize="12sp" />
                  </LinearLayout>

                  <TextView
                      android:id="@+id/surah_arabic_name"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginEnd="12dp"
                      android:textColor="#00E676"
                      android:textSize="18sp"
                      android:textStyle="bold" />

                  <ImageView
                      android:id="@+id/btn_play_surah"
                      android:layout_width="36dp"
                      android:layout_height="36dp"
                      android:src="@drawable/ic_play"
                      app:tint="#00E676"
                      android:padding="6dp" />
              </LinearLayout>
          </com.google.android.material.card.MaterialCardView>
          EOF

          cat << 'EOF' > app/src/main/res/layout/dialog_quran_surah.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp"
              android:background="#16181F">

              <TextView
                  android:id="@+id/dialog_surah_title"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center"
                  android:textColor="#00E676"
                  android:textSize="18sp"
                  android:textStyle="bold" />

              <ProgressBar
                  android:id="@+id/ayah_loading"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:layout_marginTop="20dp" />

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp">
                  <TextView
                      android:id="@+id/ayah_content"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textColor="#E0E0E0"
                      android:textSize="15sp"
                      android:lineSpacingMultiplier="1.3" />
              </ScrollView>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/deniscerri/ytdl/ui/quran/QuranActivity.kt
          package com.deniscerri.ytdl.ui.quran

          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.os.Bundle
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.widget.doAfterTextChanged
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import com.deniscerri.ytdl.R
          import com.google.android.material.dialog.MaterialAlertDialogBuilder
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.net.URL

          data class Surah(
              val number: Int,
              val name: String,
              val englishName: String,
              val englishTranslation: String,
              val numberOfAyahs: Int,
              val revelationType: String
          )

          class QuranActivity : AppCompatActivity() {

              private lateinit var recyclerSurahs: RecyclerView
              private lateinit var quranProgress: ProgressBar
              private lateinit var audioPlayerBar: LinearLayout
              private lateinit var btnAudioPlayPause: ImageView
              private lateinit var audioSurahTitle: TextView
              private var mediaPlayer: MediaPlayer? = null
              private var currentlyPlayingSurah: Int? = null

              private val surahList = mutableListOf<Surah>()
              private var adapter: SurahAdapter? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_quran)

                  findViewById<View>(R.id.btn_back).setOnClickListener { finish() }
                  recyclerSurahs = findViewById(R.id.recycler_surahs)
                  quranProgress = findViewById(R.id.quran_progress)
                  audioPlayerBar = findViewById(R.id.audio_player_bar)
                  btnAudioPlayPause = findViewById(R.id.btn_audio_play_pause)
                  audioSurahTitle = findViewById(R.id.audio_surah_title)

                  recyclerSurahs.layoutManager = LinearLayoutManager(this)

                  findViewById<ImageView>(R.id.btn_audio_close).setOnClickListener {
                      stopAudio()
                      audioPlayerBar.visibility = View.GONE
                  }

                  btnAudioPlayPause.setOnClickListener {
                      mediaPlayer?.let { player ->
                          if (player.isPlaying) {
                              player.pause()
                              btnAudioPlayPause.setImageResource(R.drawable.ic_play)
                          } else {
                              player.start()
                              btnAudioPlayPause.setImageResource(R.drawable.ic_pause)
                          }
                      }
                  }

                  findViewById<EditText>(R.id.search_surah).doAfterTextChanged { text ->
                      val query = text.toString().trim()
                      val filtered = if (query.isEmpty()) surahList else surahList.filter {
                          it.englishName.contains(query, ignoreCase = true) ||
                          it.name.contains(query, ignoreCase = true) ||
                          it.number.toString() == query
                      }
                      adapter?.updateList(filtered)
                  }

                  loadSurahList()
              }

              private fun loadSurahList() {
                  quranProgress.visibility = View.VISIBLE
                  lifecycleScope.launch(Dispatchers.IO) {
                      try {
                          val jsonUrl = "https://api.alquran.cloud/v1/surah"
                          val text = URL(jsonUrl).readText()
                          val json = JSONObject(text)
                          val dataArray = json.getJSONArray("data")

                          surahList.clear()
                          for (i in 0 until dataArray.length()) {
                              val obj = dataArray.getJSONObject(i)
                              surahList.add(
                                  Surah(
                                      number = obj.getInt("number"),
                                      name = obj.getString("name"),
                                      englishName = obj.getString("englishName"),
                                      englishTranslation = obj.getString("englishNameTranslation"),
                                      numberOfAyahs = obj.getInt("numberOfAyahs"),
                                      revelationType = obj.getString("revelationType")
                                  )
                              )
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }

                      withContext(Dispatchers.Main) {
                          quranProgress.visibility = View.GONE
                          adapter = SurahAdapter(
                              surahList,
                              onSurahClick = { surah -> viewSurahAyahs(surah) },
                              onPlayClick = { surah -> playSurahAudio(surah) }
                          )
                          recyclerSurahs.adapter = adapter
                      }
                  }
              }

              private fun playSurahAudio(surah: Surah) {
                  audioPlayerBar.visibility = View.VISIBLE
                  audioSurahTitle.text = surah.number.toString() + ". " + surah.englishName + " (" + surah.name + ")"
                  btnAudioPlayPause.setImageResource(R.drawable.ic_pause)

                  stopAudio()
                  currentlyPlayingSurah = surah.number

                  val audioUrl = String.format("https://server8.mp3quran.net/afs/%03d.mp3", surah.number)
                  Toast.makeText(this, "Streaming Surah " + surah.englishName + "...", Toast.LENGTH_SHORT).show()

                  lifecycleScope.launch(Dispatchers.IO) {
                      try {
                          mediaPlayer = MediaPlayer().apply {
                              setAudioAttributes(
                                  AudioAttributes.Builder()
                                      .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                      .setUsage(AudioAttributes.USAGE_MEDIA)
                                      .build()
                              )
                              setDataSource(audioUrl)
                              prepare()
                              start()
                          }
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) {
                              Toast.makeText(this@QuranActivity, "Audio stream error", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }

              private fun viewSurahAyahs(surah: Surah) {
                  val dialogView = layoutInflater.inflate(R.layout.dialog_quran_surah, null)
                  val title = dialogView.findViewById<TextView>(R.id.dialog_surah_title)
                  val content = dialogView.findViewById<TextView>(R.id.ayah_content)
                  val loading = dialogView.findViewById<ProgressBar>(R.id.ayah_loading)

                  title.text = surah.name + " (" + surah.englishName + ") - " + surah.numberOfAyahs + " Ayahs"

                  val dialog = MaterialAlertDialogBuilder(this)
                      .setView(dialogView)
                      .setPositiveButton("Close", null)
                      .create()
                  dialog.show()

                  lifecycleScope.launch(Dispatchers.IO) {
                      val sb = StringBuilder()
                      try {
                          val apiUrl = "https://api.alquran.cloud/v1/surah/" + surah.number + "/editions/quran-uthmani,en.sahih"
                          val text = URL(apiUrl).readText()
                          val json = JSONObject(text)
                          val dataArr = json.getJSONArray("data")
                          val arabicAyahs = dataArr.getJSONObject(0).getJSONArray("ayahs")
                          val englishAyahs = dataArr.getJSONObject(1).getJSONArray("ayahs")

                          for (i in 0 until arabicAyahs.length()) {
                              val arText = arabicAyahs.getJSONObject(i).getString("text")
                              val enText = englishAyahs.getJSONObject(i).getString("text")
                              val num = i + 1
                              sb.append("[" + num + "] " + arText + "\n" + enText + "\n\n")
                          }
                      } catch (e: Exception) {
                          sb.append("Error loading Ayahs: " + e.message)
                      }

                      withContext(Dispatchers.Main) {
                          loading.visibility = View.GONE
                          content.text = sb.toString()
                      }
                  }
              }

              private fun stopAudio() {
                  mediaPlayer?.stop()
                  mediaPlayer?.release()
                  mediaPlayer = null
              }

              override fun onDestroy() {
                  super.onDestroy()
                  stopAudio()
              }
          }

          class SurahAdapter(
              private var list: List<Surah>,
              private val onSurahClick: (Surah) -> Unit,
              private val onPlayClick: (Surah) -> Unit
          ) : RecyclerView.Adapter<SurahAdapter.ViewHolder>() {

              class ViewHolder(v: View) : RecyclerView.ViewHolder(v) {
                  val number: TextView = v.findViewById(R.id.surah_number)
                  val english: TextView = v.findViewById(R.id.surah_english_name)
                  val meta: TextView = v.findViewById(R.id.surah_meta)
                  val arabic: TextView = v.findViewById(R.id.surah_arabic_name)
                  val btnPlay: ImageView = v.findViewById(R.id.btn_play_surah)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder {
                  val v = LayoutInflater.from(parent.context).inflate(R.layout.item_surah, parent, false)
                  return ViewHolder(v)
              }

              override fun onBindViewHolder(holder: ViewHolder, position: Int) {
                  val item = list[position]
                  holder.number.text = item.number.toString()
                  holder.english.text = item.englishName
                  holder.meta.text = item.englishTranslation + " • " + item.numberOfAyahs + " Ayahs • " + item.revelationType
                  holder.arabic.text = item.name

                  holder.itemView.setOnClickListener { onSurahClick(item) }
                  holder.btnPlay.setOnClickListener { onPlayClick(item) }
              }

              override fun getItemCount() = list.size

              fun updateList(newList: List<Surah>) {
                  list = newList
                  notifyDataSetChanged()
              }
          }
          EOF

      - name: Safe Patcher (Manifest, Layout & Kotlin Hooks)
        run: |
          python3 - << 'PYEOF'
          import os
          import re

          # 1. Register Activity in Manifest
          manifest_file = 'app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_file):
              with open(manifest_file, 'r', encoding='utf-8') as f:
                  m = f.read()
              if 'QuranActivity' not in m:
                  m = m.replace('</application>', '    <activity android:name="com.deniscerri.ytdl.ui.quran.QuranActivity" android:exported="false" />\n    </application>')
                  with open(manifest_file, 'w', encoding='utf-8') as f:
                      f.write(m)

          # 2. Add Quran item into fragment_more.xml
          more_xml = 'app/src/main/res/layout/fragment_more.xml'
          if os.path.exists(more_xml):
              with open(more_xml, 'r', encoding='utf-8') as f:
                  x = f.read()
              if 'id="@+id/quran_app"' not in x:
                  q_btn = '''            <TextView
                      android:id="@+id/quran_app"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:drawablePadding="35dp"
                      android:textSize="16sp"
                      android:paddingVertical="15dp"
                      android:text="Al-Quran (القرآن الكريم)"
                      android:textColor="#00E676"
                      android:textStyle="bold"
                      android:clickable="true"
                      android:focusable="true"
                      android:background="?android:attr/selectableItemBackground"
                      android:paddingHorizontal="15dp"
                      app:drawableStartCompat="@drawable/ic_quran" />
          '''
                  x = re.sub(r'(<TextView\s+android:id="@+id/settings"[^>]*>)', q_btn + r'\1', x)
                  with open(more_xml, 'w', encoding='utf-8') as f:
                      f.write(x)

          # 3. Safely hook MoreFragment.kt
          more_kt = 'app/src/main/java/com/deniscerri/ytdl/ui/more/MoreFragment.kt'
          if os.path.exists(more_kt):
              with open(more_kt, 'r', encoding='utf-8') as f:
                  m_kt = f.read()
              if 'QuranActivity' not in m_kt:
                  m_kt = re.sub(r'(package [^\n]+)', r'\1\nimport com.deniscerri.ytdl.ui.quran.QuranActivity\nimport android.widget.TextView', m_kt, count=1)
                  hook = '''
                  view.findViewById<android.widget.TextView>(R.id.quran_app)?.setOnClickListener {
                      startActivity(android.content.Intent(requireContext(), QuranActivity::class.java))
                  }
                  '''
                  if 'settings =' in m_kt:
                      m_kt = m_kt.replace('settings =', hook + '\n        settings =')
                  with open(more_kt, 'w', encoding='utf-8') as f:
                      f.write(m_kt)

          # 4. Safely hook HomeFragment.kt (Without overriding or breaking existing variables)
          home_kt = 'app/src/main/java/com/deniscerri/ytdl/ui/HomeFragment.kt'
          if os.path.exists(home_kt):
              with open(home_kt, 'r', encoding='utf-8') as f:
                  h_kt = f.read()
              if 'QuranActivity' not in h_kt:
                  h_kt = re.sub(r'(package [^\n]+)', r'\1\nimport com.deniscerri.ytdl.ui.quran.QuranActivity', h_kt, count=1)
                  hook_home = '''
                  view.findViewById<android.view.View>(R.id.pill_quran)?.setOnClickListener {
                      startActivity(android.content.Intent(requireContext(), QuranActivity::class.java))
                  }
                  '''
                  h_kt = h_kt.replace('super.onViewCreated(view, savedInstanceState)', 'super.onViewCreated(view, savedInstanceState)\n' + hook_home)
                  with open(home_kt, 'w', encoding='utf-8') as f:
                      f.write(h_kt)

          print("All files patched safely without syntax errors!")
          PYEOF

      - name: Build Android APK
        run: |
          chmod +x gradlew
          BUILD_TASK="${{ inputs.build_type || 'assembleRelease' }}"
          ./gradlew ":${{ env.main_project_module }}:${BUILD_TASK}" \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseParallelGC" \
            -Pandroid.native.buildOutput=verbose \
            --stacktrace --warning-mode none

      - name: Commit & Push Patched Code to Repository
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-fix: Safe patch and Quran feature [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No file changes to commit."
          fi

      - name: Collect Output APKs
        if: success()
        run: |
          mkdir -p build_output_apks
          find . -type f -name "*.apk" -not -path "*/intermediates/*" -exec cp {} build_output_apks/ \;
          echo "Collected APK files:"
          ls -lh build_output_apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: App-Release-Builds
          path: build_output_apks/
          if-no-files-found: warn
