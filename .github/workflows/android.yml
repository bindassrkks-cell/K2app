          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  m_content = f.read()

              if 'com.deniscerri.ytdl.ui.quran.QuranActivity' not in m_content:
                  entry = '''        <activity
                      android:name="com.deniscerri.ytdl.ui.quran.QuranActivity"
                      android:exported="false" />
              </application>'''
                  m_content = m_content.replace('</application>', entry)
                  with open(manifest_path, 'w', encoding='utf-8') as f:
                      f.write(m_content)

          # Add Quran entry to fragment_more.xml
          more_xml_path = 'app/src/main/res/layout/fragment_more.xml'
          if os.path.exists(more_xml_path):
              with open(more_xml_path, 'r', encoding='utf-8') as f:
                  mxml = f.read()

              if 'android:id="@+id/quran_app"' not in mxml:
                  quran_view = '''            <TextView
                      android:id="@+id/quran_app"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:drawablePadding="35dp"
                      android:textSize="16sp"
                      android:paddingVertical="15dp"
                      android:text="Al-Quran (القرآن الكريم)"
                      android:textColor="#00E676"
                      android:textStyle="bold"
                      android:clickable="true"
                      android:focusable="true"
                      android:background="?android:attr/selectableItemBackground"
                      android:paddingHorizontal="15dp"
                      app:drawableStartCompat="@drawable/ic_quran" />
          '''
                  mxml = re.sub(r'(<TextView\s+android:id="@+id/settings".*?/>)', quran_view + r'\1', mxml, flags=re.DOTALL)
                  with open(more_xml_path, 'w', encoding='utf-8') as f:
                      f.write(mxml)

          # Inject Quran click listener in MoreFragment.kt
          more_kt_path = 'app/src/main/java/com/deniscerri/ytdl/ui/more/MoreFragment.kt'
          if os.path.exists(more_kt_path):
              with open(more_kt_path, 'r', encoding='utf-8') as f:
                  mkt = f.read()

              if 'com.deniscerri.ytdl.ui.quran.QuranActivity' not in mkt:
                  mkt = "import com.deniscerri.ytdl.ui.quran.QuranActivity\n" + mkt
                  quran_code = '''        view.findViewById<TextView>(R.id.quran_app)?.setOnClickListener {
                      startActivity(android.content.Intent(requireContext(), QuranActivity::class.java))
                  }
          '''
                  mkt = mkt.replace('settings = view.findViewById(R.id.settings)', quran_code + '\n        settings = view.findViewById(R.id.settings)')
                  with open(more_kt_path, 'w', encoding='utf-8') as f:
                      f.write(mkt)

          # Update bottom nav title to Social Feed
          menu_path = 'app/src/main/res/menu/main_nav_menu.xml'
          if os.path.exists(menu_path):
              with open(menu_path, 'r', encoding='utf-8') as f:
                  mcontent = f.read()
              mcontent = re.sub(r'(<item\s+android:id="@+id/historyFragment".*?android:title=)"[^"]*"', r'\1"Social Feed"', mcontent)
              with open(menu_path, 'w', encoding='utf-8') as f:
                  f.write(mcontent)

          print("Python injector finished successfully!")
          PYEOF

          # 6. INJECT BUTTON ACTIONS INTO HOMEFRAGMENT
          python3 - << 'PYEOF'
          import os

          home_kt = 'app/src/main/java/com/deniscerri/ytdl/ui/HomeFragment.kt'
          if os.path.exists(home_kt):
              with open(home_kt, 'r', encoding='utf-8') as f:
                  code = f.read()

              if 'loadIslamicHomeContent' not in code:
                  import_header = "import com.deniscerri.ytdl.ui.quran.QuranActivity\nimport org.json.JSONArray\n"
                  code = import_header + code

                  hook_injection = '''
                          view.findViewById<View>(R.id.pill_quran)?.setOnClickListener {
                              startActivity(android.content.Intent(requireContext(), QuranActivity::class.java))
                          }
                          view.findViewById<View>(R.id.pill_history)?.setOnClickListener {
                              loadIslamicHomeContent()
                          }
                  '''
                  code = code.replace('super.onViewCreated(view, savedInstanceState)', 'super.onViewCreated(view, savedInstanceState)\n' + hook_injection)

                  helper_func = '''
                      private fun loadIslamicHomeContent() {
                          lifecycleScope.launch(kotlinx.coroutines.Dispatchers.IO) {
                              try {
                                  val text = java.net.URL("https://raw.githubusercontent.com/Bindassrkks/K2app/main/data.json").readText()
                                  val jsonArray = org.json.JSONArray(text)
                                  val urls = mutableListOf<String>()
                                  for (i in 0 until jsonArray.length()) {
                                      val u = jsonArray.getJSONObject(i).optString("url")
                                      if (u.isNotEmpty()) urls.add(u)
                                  }
                                  if (urls.isNotEmpty()) {
                                      kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.Main) {
                                          resultViewModel.deleteAll()
                                          resultViewModel.parseQueries(urls) {}
                                      }
                                  }
                              } catch (e: Exception) {
                                  e.printStackTrace()
                              }
                          }
                      }
                  '''
                  last_brace = code.rfind('}')
                  if last_brace != -1:
                      code = code[:last_brace] + helper_func + '\n}'
                  with open(home_kt, 'w', encoding='utf-8') as f:
                      f.write(code)

          print("HomeFragment patched without overriding source!")
          PYEOF

      - name: Build Android APK
        run: |
          chmod +x gradlew
          BUILD_TASK="${{ inputs.build_type || 'assembleRelease' }}"
          ./gradlew ":${{ env.main_project_module }}:${BUILD_TASK}" \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseParallelGC" \
            -Pandroid.native.buildOutput=verbose \
            --stacktrace --warning-mode none

      - name: Commit & Push Patched Code to Repository
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-fix: AMOLED UI, Quran & Islamic feed patch [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No file changes to commit."
          fi

      - name: Collect Output APKs
        if: success()
        run: |
          mkdir -p build_output_apks
          find . -type f -name "*.apk" -not -path "*/intermediates/*" -exec cp {} build_output_apks/ \;
          echo "Collected APK files:"
          ls -lh build_output_apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: App-Release-Builds
          path: build_output_apks/
          if-no-files-found: warn
