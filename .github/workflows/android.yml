                                  android:layout_width="match_parent"
                                  android:layout_height="match_parent"
                                  android:padding="8dp"
                                  android:src="@drawable/ic_play"
                                  app:tint="#00E676" />
                          </com.google.android.material.card.MaterialCardView>

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="10dp"
                              android:text="Al-SHOW  BÉTÆ"
                              android:textColor="#FFFFFF"
                              android:textSize="20sp"
                              android:textStyle="bold" />
                      </LinearLayout>

                      <ImageView
                          android:id="@+id/btn_quick_search"
                          android:layout_width="42dp"
                          android:layout_height="42dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:clickable="true"
                          android:focusable="true"
                          android:padding="9dp"
                          android:src="@drawable/ic_search"
                          app:tint="#E0E0E0" />

                      <ImageView
                          android:id="@+id/btn_settings"
                          android:layout_width="42dp"
                          android:layout_height="42dp"
                          android:layout_marginStart="4dp"
                          android:background="?attr/selectableItemBackgroundBorderless"
                          android:clickable="true"
                          android:focusable="true"
                          android:padding="8dp"
                          android:src="@drawable/ic_settings"
                          app:tint="#E0E0E0" />
                  </LinearLayout>

                  <HorizontalScrollView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:scrollbars="none"
                      android:paddingStart="14dp"
                      android:paddingEnd="14dp"
                      android:paddingBottom="10dp"
                      android:clipToPadding="false">

                      <LinearLayout
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical">

                          <com.google.android.material.card.MaterialCardView
                              android:id="@+id/pill_history"
                              android:layout_width="wrap_content"
                              android:layout_height="36dp"
                              android:layout_marginEnd="8dp"
                              app:cardCornerRadius="18dp"
                              app:cardBackgroundColor="#1B2B23"
                              app:strokeColor="#00E676"
                              app:strokeWidth="1dp"
                              android:clickable="true"
                              android:focusable="true">
                              <LinearLayout
                                  android:layout_width="wrap_content"
                                  android:layout_height="match_parent"
                                  android:gravity="center"
                                  android:paddingHorizontal="14dp">
                                  <ImageView
                                      android:layout_width="16dp"
                                      android:layout_height="16dp"
                                      android:src="@drawable/ic_history"
                                      app:tint="#00E676" />
                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:layout_marginStart="6dp"
                                      android:text="Islamic Stream"
                                      android:textColor="#00E676"
                                      android:textStyle="bold"
                                      android:textSize="12sp" />
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>

                          <com.google.android.material.card.MaterialCardView
                              android:id="@+id/pill_quran"
                              android:layout_width="wrap_content"
                              android:layout_height="36dp"
                              android:layout_marginEnd="8dp"
                              app:cardCornerRadius="18dp"
                              app:cardBackgroundColor="#16181F"
                              app:strokeColor="#00E676"
                              app:strokeWidth="1dp"
                              android:clickable="true"
                              android:focusable="true">
                              <LinearLayout
                                  android:layout_width="wrap_content"
                                  android:layout_height="match_parent"
                                  android:gravity="center"
                                  android:paddingHorizontal="14dp">
                                  <ImageView
                                      android:layout_width="16dp"
                                      android:layout_height="16dp"
                                      android:src="@drawable/ic_quran"
                                      app:tint="#00E676" />
                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:layout_marginStart="6dp"
                                      android:text="Al-Quran"
                                      android:textColor="#FFFFFF"
                                      android:textStyle="bold"
                                      android:textSize="12sp" />
                              </LinearLayout>
                          </com.google.android.material.card.MaterialCardView>

                          <com.google.android.material.card.MaterialCardView
                              android:id="@+id/pill_input_url"
                              android:layout_width="wrap_content"
                              android:layout_height="36dp"
                              android:layout_marginEnd="8dp"
                              app:cardCornerRadius="18dp"
                              app:cardBackgroundColor="#16181F"
                              app:strokeColor="#262A36"
                              app:strokeWidth="1dp"
                              android:clickable="true"
                              android:focusable="true">
                              <LinearLayout
                                  android:layout_width="wrap_content"
                                  android:layout_height="match_parent"
                                  android:gravity="center"
                                  android:paddingHorizontal="14dp">
                                  <ImageView
                                      android:layout_width="16dp"
                                      android:layout_height="16dp"
                                      android:src="@drawable/ic_search"
                                      app:tint="#A0A0A0" />
                                  <TextView
                                      android:layout_width="wrap_content"
                                      android:layout_height="wrap_content"
                                      android:layout_marginStart="6dp"
