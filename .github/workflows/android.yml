                      android:id="@+id/shimmer_results_framelayout"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:visibility="gone">
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:padding="12dp">
                          <View
                              android:layout_width="match_parent"
                              android:layout_height="220dp"
                              android:background="#16181F"
                              android:layout_marginBottom="14dp" />
                      </LinearLayout>
                  </com.facebook.shimmer.ShimmerFrameLayout>

                  <androidx.recyclerview.widget.RecyclerView
                      android:id="@+id/recyclerViewHome"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:paddingHorizontal="10dp"
                      android:paddingTop="4dp"
                      android:paddingBottom="90dp"
                      android:clipToPadding="false" />

                  <androidx.constraintlayout.widget.ConstraintLayout
                      android:id="@+id/queries_constraint"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:visibility="gone"
                      android:background="#16181F"
                      android:padding="8dp"
                      app:layout_constraintTop_toTopOf="parent">

                      <com.google.android.material.chip.ChipGroup
                          android:id="@+id/queries"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          app:layout_constraintStart_toStartOf="parent"
                          app:layout_constraintEnd_toStartOf="@+id/init_search_query"
                          app:layout_constraintTop_toTopOf="parent" />

                      <com.google.android.material.button.MaterialButton
                          android:id="@+id/init_search_query"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Start"
                          app:layout_constraintEnd_toEndOf="parent"
                          app:layout_constraintTop_toTopOf="parent" />
                  </androidx.constraintlayout.widget.ConstraintLayout>

                  <ProgressBar
                      android:id="@+id/progress"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:visibility="gone"
                      app:layout_constraintBottom_toBottomOf="parent"
                      app:layout_constraintEnd_toEndOf="parent"
                      app:layout_constraintStart_toStartOf="parent"
                      app:layout_constraintTop_toTopOf="parent" />

              </androidx.constraintlayout.widget.ConstraintLayout>

              <LinearLayout
                  android:id="@+id/home_fabs"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:layout_gravity="bottom|end"
                  android:layout_margin="16dp">

                  <com.google.android.material.floatingactionbutton.ExtendedFloatingActionButton
                      android:id="@+id/copied_url_fab"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Paste &amp; Play"
                      android:visibility="gone"
                      android:layout_marginBottom="8dp"
                      app:icon="@drawable/ic_link"
                      android:backgroundTint="#00E676"
                      android:textColor="#000000"
                      app:iconTint="#000000" />

                  <com.google.android.material.floatingactionbutton.ExtendedFloatingActionButton
                      android:id="@+id/download_selected_fab"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Download Selected"
                      android:visibility="gone"
                      android:layout_marginBottom="8dp"
                      app:icon="@drawable/ic_download"
                      android:backgroundTint="#262A36"
                      android:textColor="#FFFFFF" />

                  <com.google.android.material.floatingactionbutton.ExtendedFloatingActionButton
                      android:id="@+id/download_all_fab"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Download Playlist"
                      android:visibility="gone"
                      app:icon="@drawable/ic_download"
                      android:backgroundTint="#00E676"
                      android:textColor="#000000"
                      app:iconTint="#000000" />
              </LinearLayout>

              <com.google.android.material.search.SearchView
                  android:id="@+id/search_view"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:hint="Search Quran recitations..."
                  app:layout_anchor="@id/search_bar">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical"
                      android:background="#0A0B0E">

                      <HorizontalScrollView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:padding="8dp">
                          <com.google.android.material.chip.ChipGroup
                              android:id="@+id/providers"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              app:singleSelection="true" />
                      </HorizontalScrollView>

                      <View
                          android:id="@+id/chipGroupDivider"
                          android:layout_width="match_parent"
                          android:layout_height="1dp"
                          android:background="#1E2029" />

                      <androidx.recyclerview.widget.RecyclerView
                          android:id="@+id/search_suggestions_recycler"
                          android:layout_width="match_parent"
                          android:layout_height="match_parent" />
                  </LinearLayout>
              </com.google.android.material.search.SearchView>

          </androidx.coordinatorlayout.widget.CoordinatorLayout>
          EOF

      - name: Patch MoreFragment and Manifest (No Duplicate Imports)
        run: |
          python3 - << 'PYEOF'
          import os
          import re

          # 1. Clean MoreFragment.kt of any conflicting TextView / Quran imports
          more_kt = 'app/src/main/java/com/deniscerri/ytdl/ui/more/MoreFragment.kt'
          if os.path.exists(more_kt):
              with open(more_kt, 'r', encoding='utf-8') as f:
                  lines = f.readlines()
              clean_lines = [l for l in lines if not l.strip().startswith('import android.widget.TextView') and not l.strip().startswith('import com.deniscerri.ytdl.ui.quran.QuranActivity')]
              code = "".join(clean_lines)
              code = re.sub(r'(package [^\n]+)', r'\1\nimport android.widget.TextView\nimport com.deniscerri.ytdl.ui.quran.QuranActivity', code, count=1)
              if 'quran_app' not in code:
                  hook = '''
                  view.findViewById<TextView>(R.id.quran_app)?.setOnClickListener {
                      startActivity(android.content.Intent(requireContext(), QuranActivity::class.java))
                  }
                  '''
                  code = code.replace('settings =', hook + '\n        settings =')
              with open(more_kt, 'w', encoding='utf-8') as f:
                  f.write(code)

          # 2. Add Activity to Manifest
          manifest = 'app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest):
              with open(manifest, 'r', encoding='utf-8') as f:
                  m = f.read()
              if 'QuranActivity' not in m:
                  m = m.replace('</application>', '    <activity android:name="com.deniscerri.ytdl.ui.quran.QuranActivity" android:exported="false" />\n    </application>')
                  with open(manifest, 'w', encoding='utf-8') as f:
                      f.write(m)
          print("Patched MoreFragment and Manifest cleanly!")
          PYEOF

      - name: Build Android APK
        run: |
          chmod +x gradlew
          BUILD_TASK="${{ inputs.build_type || 'assembleRelease' }}"
          ./gradlew ":${{ env.main_project_module }}:${BUILD_TASK}" \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseParallelGC" \
            --stacktrace --warning-mode none

      - name: Commit & Push All Changes to Repository
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: AMOLED Dark UI, Quran & Islamic Stream permanently applied [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "SUCCESS: Code pushed to GitHub repository!"
          fi

      - name: Collect Output APKs
        if: success()
        run: |
          mkdir -p build_output_apks
          find . -type f -name "*.apk" -not -path "*/intermediates/*" -exec cp {} build_output_apks/ \;
          ls -lh build_output_apks/

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: App-Release-Builds
          path: build_output_apks/
          if-no-files-found: error
