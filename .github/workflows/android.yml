name: Android CI

env:
  main_project_module: app

permissions: {}

on:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'corretto'
        cache: 'gradle'

    - name: Create Keystore & Properties
      run: |
        echo "${{ secrets.BASE_64_SIGNING_KEY }}" > app/release_keystore.txt
        base64 -d "app/release_keystore.txt" > app/release_keystore.jks 2>/dev/null || true
        touch local.properties
        echo "${{ secrets.LOCAL_PROPERTIES }}" > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew :${{ env.main_project_module }}:assembleRelease --stacktrace

    - name: Locate and Collect APKs
      run: |
        mkdir -p build_output_apks
        find ${{ env.main_project_module }}/build/outputs/apk/ -type f -name "*.apk" -exec cp {} build_output_apks/ \;
        echo "Found APKs:"
        ls -lh build_output_apks/

    - name: Upload APKs Artifact
      uses: actions/upload-artifact@v4
      with:
        name: YTDLnis-Release-APKs
        path: build_output_apks/
        if-no-files-found: error

    - name: Send Telegram notification
      continue-on-error: true
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          ${{ github.actor }} build finished for:
          Commit: ${{ github.event.commits[0].message }}
          Repo: ${{ github.repository }}
