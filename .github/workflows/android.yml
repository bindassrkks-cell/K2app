name: K2App Android CI

env:
  main_project_module: app

permissions:
  contents: read

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: false
        default: 'assembleRelease'
        type: choice
        options:
          - assembleRelease
          - assembleDebug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: corretto
          cache: gradle

      - name: Prepare CI keystore
        run: |
          mkdir -p ~/.android app
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore app/debug.keystore
          cp debug.keystore app/release_keystore.jks
          cp debug.keystore release_keystore.jks
          printf "storeFile=release_keystore.jks\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n" > keystore.properties
          cp keystore.properties app/keystore.properties

      - name: Build Android APK
        run: |
          chmod +x gradlew
          BUILD_TASK="${{ inputs.build_type || 'assembleRelease' }}"
          ./gradlew ":${{ env.main_project_module }}:${BUILD_TASK}" \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseParallelGC" \
            --stacktrace --warning-mode none

      - name: Collect APKs
        if: success()
        run: |
          mkdir -p build_output_apks
          find . -type f -name "*.apk" -not -path "*/intermediates/*" -exec cp {} build_output_apks/ \;
          ls -lh build_output_apks/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: K2App-Android-Builds
          path: build_output_apks/
          if-no-files-found: error
